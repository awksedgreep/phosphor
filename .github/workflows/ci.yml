name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings
      - name: fmt
        run: cargo fmt --check
      - name: tests
        # Optional integrations detect installed dependencies. The next step
        # supplies real sqld; the timeless extension is not installed here.
        run: cargo test
      - name: real sqld transactions and saved scripts
        run: python3 tools/test_sqld.py
      - name: manual is generated, not stale
        # docs/MANUAL.md must match `phosphor --manual` (issue #24).
        run: |
          cargo run --quiet --bin phosphor -- --manual | diff -u docs/MANUAL.md -
      - name: perf budgets (release)
        # DESIGN.md speed budgets, asserted only in release (issue #23).
        run: cargo test --release perf_budget
      - name: build release
        run: cargo build --release
