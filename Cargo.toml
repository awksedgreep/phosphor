[package]
name = "phosphor"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "The 1988 green-screen database desktop, reborn: forms, reports, menus, and a self-monitoring SQLite/libSQL database. The moon in a terminal."
repository = "https://github.com/awksedgreep/phosphor"

[dependencies]
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
# bundled: one binary, no system sqlite, no macOS "not authorized".
# load_extension: opt-in loading of libtimeless_ext via PHOSPHOR_EXT.
rusqlite = { version = "0.37", features = ["bundled", "load_extension", "hooks", "backup"] }
# Remote backend: Hrana over HTTP to self-hosted sqld (blocking by
# design — DESIGN.md "no async runtime in v1").
ureq = { version = "2", features = ["json"] }
serde_json = "1"
unicode-width = "0.2"
unicode-segmentation = "1"
base64 = "0.22"
csv = "1.4"
# Scripting hook (#12): Lua, vendored so one binary and no system dep.
# DESIGN.md kept the language choice open; Lua is the dBASE-lineage pick.
mlua = { version = "0.10", features = ["lua54", "vendored"] }

# The faker seeder: cargo run --release --features seed --bin phosphor-seed
fake = { version = "2", optional = true }
rand = { version = "0.8", optional = true }

[features]
seed = ["dep:fake", "dep:rand"]

[[bin]]
name = "phosphor"
path = "src/main.rs"

[[bin]]
name = "phosphor-seed"
path = "src/bin/seed.rs"
required-features = ["seed"]
