[package]
name = "phosphor"
version = "0.0.1"
edition = "2021"
license = "MIT"
description = "The 1988 green-screen database desktop, reborn: forms, reports, menus, and a self-monitoring SQLite/libSQL database. The moon in a terminal."
repository = "https://github.com/awksedgreep/phosphor"

[dependencies]
ratatui = "0.29"
# bundled: one binary, no system sqlite, no macOS "not authorized".
# load_extension: opt-in loading of libtimeless_ext via PHOSPHOR_EXT.
rusqlite = { version = "0.37", features = ["bundled", "load_extension"] }
# Remote backend: Hrana over HTTP to self-hosted sqld (blocking by
# design — DESIGN.md "no async runtime in v1").
ureq = { version = "2", features = ["json"] }
serde_json = "1"
base64 = "0.22"
